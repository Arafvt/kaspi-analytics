server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # Хешированные ассеты (имя меняется при сборке) — кэшируем надолго
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA-роутинг
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html НЕ кэшируем — иначе браузер держит старую версию,
  # ссылающуюся на уже несуществующий JS-бандл, и страница не открывается
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }

  # Проксирование API на backend
  location /api/ {
    proxy_pass http://kaspi_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
